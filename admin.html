<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ניהול - Beloved Diamond</title>
    <link rel="stylesheet" href="admin-styles.css">
</head>
<body>
    <header>
        <div class="header-content">
            <div>
                <h1>פנל ניהול - Beloved Diamond</h1>
                <p class="subtitle">ניהול תכשיטים וגלריות</p>
            </div>
            <nav>
                <a href="index.html" class="back-link">חזור לעמוד הבית</a>
            </nav>
        </div>
    </header>

    <main class="admin-container">
        <section class="admin-panel">
            <h2>הוסף תכשיט חדש</h2>

            <form id="addJewelryForm" class="jewelry-form">
                <div class="form-group">
                    <label for="title">שם התכשיט</label>
                    <input type="text" id="title" placeholder="לדוגמה: עגילים יהלום" required>
                </div>

                <div class="form-group">
                    <label for="category">קטגוריה</label>
                    <select id="category" required>
                        <option value="">בחר קטגוריה</option>
                        <option value="sets">סט תכשיטים</option>
                        <option value="earrings">עגילים</option>
                        <option value="rings">טבעות</option>
                        <option value="bracelets">צמידים</option>
                        <option value="necklaces">שרשרות</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="imageInput">בחר תמונה</label>
                    <input type="file" id="imageInput" accept="image/*" required>
                    <div id="imagePreview" class="image-preview"></div>
                </div>

                <div class="form-group">
                    <label for="description">תיאור (אופציונלי)</label>
                    <textarea id="description" placeholder="תיאור קצר של התכשיט"></textarea>
                </div>

                <button type="submit" class="btn-submit">הוסף תכשיט</button>
            </form>
        </section>

        <section class="items-list">
            <h2>תכשיטים קיימים</h2>
            <div id="itemsList" class="items-grid"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Beloved Diamond. כל הזכויות שמורות.</p>
    </footer>

    <script src="admin-script.js"></script>
</body>
</html>
